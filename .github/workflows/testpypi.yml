name: TestPyPI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: testpypi
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          count=$(gh run list --repo "$REPOSITORY" --workflow test.yml --commit "$COMMIT" --status success --json databaseId --jq 'length')
          test "$count" -gt 0 || { echo "Run the Tests workflow successfully for this commit first."; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
  install:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install fsspec
      - name: Install from TestPyPI
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            python -m pip install --no-deps --index-url https://test.pypi.org/simple/ daos-fsspec==1.4.1 && break
            test "$attempt" -lt 5 || exit 1
            sleep 15
          done
          python -c 'import daos_fsspec, fsspec; assert daos_fsspec.__version__ == "1.4.1"; assert fsspec.get_filesystem_class("dfs") is daos_fsspec.DFSFileSystem'
